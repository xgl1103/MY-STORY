<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f2" />
    <title>My Story</title>
    <!-- sql.js 预加载（在 Vue 应用之前） -->
    <script src="./sql-wasm-browser.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- 启动期间的加载占位（Vue mount 后自动替换） -->
      <div id="app-loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f7f5f2;">
        <div style="width:40px;height:40px;border:3px solid rgba(0,0,0,0.08);border-top-color:#c45c3e;border-radius:50%;animation:app-spin 0.8s linear infinite;"></div>
      </div>
      <style>#app-loading{opacity:1;transition:opacity 0.2s}@keyframes app-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
